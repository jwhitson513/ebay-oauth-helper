<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Store Ops — eBay Connection</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1C2430;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    background: #EDE7D9;
    border-radius: 8px;
    max-width: 480px;
    width: 100%;
    padding: 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 {
    font-size: 18px;
    color: #1C2430;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: #6B6558;
    line-height: 1.5;
    margin: 0 0 20px;
  }
  .code-box {
    background: #fff;
    border: 1px solid #C7BFA9;
    border-radius: 6px;
    padding: 16px;
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 13px;
    word-break: break-all;
    color: #1C2430;
    margin-bottom: 16px;
    user-select: all;
  }
  button {
    background: #1C2430;
    color: #EDE7D9;
    border: none;
    border-radius: 6px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background: #2A3547; }
  .error {
    color: #A8432F;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>eBay Connection</h1>
    <div id="content">
      <p>Loading…</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const content = document.getElementById('content');

    if (error) {
      content.innerHTML = `
        <p class="error">eBay reported an error: ${error.replace(/</g, '&lt;')}</p>
        <p>Go back to Store Ops and try connecting again.</p>
      `;
    } else if (code) {
      content.innerHTML = `
        <p><strong>Copy the code below</strong>, then go back to Store Ops and paste it into the "Connect your eBay account" box.</p>
        <div class="code-box" id="codeBox">${code.replace(/</g, '&lt;')}</div>
        <button id="copyBtn">Copy code</button>
      `;
      document.getElementById('copyBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(code);
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        setTimeout(() => (btn.textContent = 'Copy code'), 1500);
      });
    } else {
      content.innerHTML = `<p class="error">No code found in the page address. Go back to Store Ops and try connecting again.</p>`;
    }
  </script>
</body>
</html>
